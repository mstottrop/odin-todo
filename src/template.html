<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My To Do App</title>
  </head>
  <body>
    <sidebar>
      <div class="top-buttons">
        <button class="inbox">Inbox</button>
      </div>
      <div class="projectsList">
        <button class="default">Default</button>
      </div>
      <div class="bottom-buttons">
        <dialog id="projectDialog">
          <form method="dialog">
            <p>Enter a new project here!</p>
            <div>
              <label for="projectTitle">Choose a title: </label>
              <input type="text" name="projectTitle" id="projectTitle" />
            </div>
            <div class="formButton">
              <button>OK</button>
            </div>
          </form>
        </dialog>
        <button id="addProject">+ New Project</button>
      </div>
    </sidebar>
    <content>
      <div class="main-area">
        <p>
          Welcome to <i>Fate's Loom</i> – Weave your destiny, one task at a
          time.
        </p>
        <div class="todosDarstellung">
          <h3>Here comes the Title of the Todo</h3>
          <p>Here comes the Project of the Todo</p>
        </div>
      </div>
      <div class="bottom-area">
        <button class="addTodo" id="todoModalBtn">+</button>
        <dialog id="todoDialog">
          <form method="dialog">
            <p>Enter a new To Do here!</p>
            <div>
              <label for="title">Choose a title: </label>
              <input type="text" name="title" id="title" />
            </div>
            <div>
              <label for="projectsSelect">Choose a project: </label>
              <select name="projectsSelect" id="projectsSelect"></select>
            </div>
            <div class="descriptionDiv">
              <label for="description">Enter a description: </label>
              <textarea name="description" id="description"></textarea>
            </div>
            <div class="formButton">
              <button>OK</button>
            </div>
          </form>
        </dialog>
      </div>
    </content>
  </body>
</html>
